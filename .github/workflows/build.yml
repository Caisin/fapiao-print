name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 确保 Node.js 子进程使用 UTF-8
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UTF-8 encoding
        shell: pwsh
        run: |
          # 设置控制台代码页为 UTF-8，确保中文文件名正确
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          # 验证
          Write-Host "代码页: $(chcp)"
          Write-Host "测试中文输出: 发票酱"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build all (4 products)
        shell: pwsh
        run: |
          # 确保构建过程使用 UTF-8
          $env:PYTHONIOENCODING = "utf-8"
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          npm run build:all

      - name: Verify artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== 验证构建产物 ==="
          $dist = "dist"
          $expected = @(
            "发票酱_*_x64-setup.exe",
            "发票酱_*_x64_绿色版.exe",
            "发票酱_*_x64_OCR版-setup.exe",
            "发票酱_*_x64_OCR绿色版.zip"
          )
          $files = Get-ChildItem -Path $dist -File
          if ($files.Count -ne 4) {
            Write-Host "❌ 期望 4 个产物，实际找到 $($files.Count) 个"
            $files | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          $files | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host "✅ $($_.Name) ($sizeMB MB)"
          }

      - name: Rename if Chinese lost (fallback)
        shell: pwsh
        run: |
          # 兜底：如果 NSIS 安装包文件名丢失了中文，强制重命名
          $dist = "dist"
          $version = (Get-Content package.json | ConvertFrom-Json).version

          $renameMap = @{
            # 模式: 不含中文的文件名 → 正确的中文名
            "_${version}_x64-setup.exe"                = "发票酱_${version}_x64-setup.exe"
            "_${version}_x64_OCR.-setup.exe"           = "发票酱_${version}_x64_OCR版-setup.exe"
            "_${version}_x64_OCR-setup.exe"            = "发票酱_${version}_x64_OCR版-setup.exe"
          }

          foreach ($entry in $renameMap.GetEnumerator()) {
            $oldPath = Join-Path $dist $entry.Key
            $newPath = Join-Path $dist $entry.Value
            if (Test-Path $oldPath) {
              Move-Item -Force $oldPath $newPath
              Write-Host "🔄 重命名: $($entry.Key) → $($entry.Value)"
            }
          }

          # 检查绿色便携版文件名（轻量版=exe, OCR版=zip）
          $zipRenameMap = @{
            "_${version}_x64_.exe"                     = "发票酱_${version}_x64_绿色版.exe"
            "_${version}_x64_OCR.zip"                  = "发票酱_${version}_x64_OCR绿色版.zip"
          }

          foreach ($entry in $zipRenameMap.GetEnumerator()) {
            $oldPath = Join-Path $dist $entry.Key
            $newPath = Join-Path $dist $entry.Value
            if (Test-Path $oldPath) {
              Move-Item -Force $oldPath $newPath
              Write-Host "🔄 重命名: $($entry.Key) → $($entry.Value)"
            }
          }

      - name: List final artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== 最终产物列表 ==="
          Get-ChildItem -Path dist -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host "  $($_.Name)  ($sizeMB MB)"
          }

      - name: Stage ASCII-safe release names
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-dist | Out-Null
          $files = @{
            "fapiao-print_${version}_windows_x64-setup.exe" = (Get-ChildItem dist -Filter "*_${version}_x64-setup.exe" | Select-Object -First 1)
            "fapiao-print_${version}_windows_x64-portable.exe" = (Get-ChildItem dist -Filter "*_${version}_x64_绿色版.exe" | Select-Object -First 1)
            "fapiao-print_${version}_windows_x64_OCR-setup.exe" = (Get-ChildItem dist -Filter "*_${version}_x64_OCR版-setup.exe" | Select-Object -First 1)
            "fapiao-print_${version}_windows_x64_OCR-portable.zip" = (Get-ChildItem dist -Filter "*_${version}_x64_OCR绿色版.zip" | Select-Object -First 1)
          }
          foreach ($entry in $files.GetEnumerator()) {
            if ($null -eq $entry.Value) {
              throw "未找到待发布产物: $($entry.Key)"
            }
            Copy-Item $entry.Value.FullName (Join-Path release-dist $entry.Key)
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal packages
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build lightweight and OCR DMGs
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          mkdir -p dist

          npx tauri build --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json
          light_dmg=$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$light_dmg"
          cp "$light_dmg" "dist/fapiao-print_${version}_macOS_Universal.dmg"

          rm -rf "$bundle_dir"
          npx tauri build --target universal-apple-darwin --features ocr --config src-tauri/tauri.macos.ocr.conf.json
          ocr_dmg=$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$ocr_dmg"
          cp "$ocr_dmg" "dist/fapiao-print_${version}_macOS_Universal_OCR.dmg"

      - name: Verify macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile_count=$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          test "$mapfile_count" = "2"
          ls -lh dist/*.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/^## ${GITHUB_REF_NAME} /,/^---$/p" CHANGELOG.md | sed '$d' > release_body.txt
          if [ ! -s release_body.txt ]; then
            printf 'See [CHANGELOG](https://github.com/Caisin/fapiao-print/blob/master/CHANGELOG.md) for details.\n' > release_body.txt
          else
            printf '\n---\n详见 [CHANGELOG](https://github.com/Caisin/fapiao-print/blob/master/CHANGELOG.md)\n' >> release_body.txt
          fi

      - name: List release packages
        run: ls -lh release-assets

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.txt
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
